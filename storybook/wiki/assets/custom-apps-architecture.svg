<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Framework Container -->
  <rect x="40" y="40" width="720" height="200" rx="12" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="400" y="65" fill="#22d3ee" font-size="14" font-weight="600" text-anchor="middle">fde-desktop Framework</text>
  
  <!-- React + Mantine + Zustand -->
  <rect x="60" y="80" width="680" height="140" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="105" fill="white" font-size="11" font-weight="500" text-anchor="middle">React 19 + Mantine + Zustand</text>
  
  <!-- Stores -->
  <rect x="80" y="120" width="140" height="80" rx="6" fill="rgba(34, 211, 238, 0.1)" stroke="#22d3ee" stroke-width="1"/>
  <text x="150" y="148" fill="white" font-size="10" font-weight="600" text-anchor="middle">Stores</text>
  <text x="150" y="165" fill="#94a3b8" font-size="8" text-anchor="middle">desktopStore</text>
  <text x="150" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">customAppStore</text>
  
  <!-- Hooks -->
  <rect x="240" y="120" width="140" height="80" rx="6" fill="rgba(34, 211, 238, 0.1)" stroke="#22d3ee" stroke-width="1"/>
  <text x="310" y="148" fill="white" font-size="10" font-weight="600" text-anchor="middle">Hooks</text>
  <text x="310" y="165" fill="#94a3b8" font-size="8" text-anchor="middle">useOpenApp</text>
  <text x="310" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">useTheme</text>
  
  <!-- Public API -->
  <rect x="400" y="120" width="180" height="80" rx="6" fill="rgba(52, 211, 153, 0.1)" stroke="#34d399" stroke-width="1"/>
  <text x="490" y="148" fill="white" font-size="10" font-weight="600" text-anchor="middle">window.__FDE_API__</text>
  <text x="490" y="168" fill="#94a3b8" font-size="8" text-anchor="middle">Public API</text>
  <text x="490" y="183" fill="#94a3b8" font-size="8" text-anchor="middle">(Framework Interface)</text>
  
  <!-- Connection line -->
  <line x1="400" y1="240" x2="400" y2="280" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="420" y="265" fill="#34d399" font-size="9">window.__FDE_API__</text>
  
  <!-- App Container -->
  <rect x="60" y="290" width="680" height="260" rx="12" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
  <text x="400" y="315" fill="#34d399" font-size="14" font-weight="600" text-anchor="middle">Independent App (DOM Container)</text>
  
  <!-- App DOM Container -->
  <rect x="80" y="330" width="640" height="200" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="355" fill="#94a3b8" font-size="9" text-anchor="middle">&lt;div id="app-container-{appId}"&gt;</text>
  
  <!-- React Renderer -->
  <rect x="100" y="370" width="280" height="140" rx="6" fill="rgba(52, 211, 153, 0.15)" stroke="#34d399" stroke-width="1"/>
  <text x="240" y="398" fill="white" font-size="11" font-weight="600" text-anchor="middle">React 18</text>
  
  <!-- Own renderer -->
  <text x="240" y="425" fill="#94a3b8" font-size="8" text-anchor="middle">↖ Own renderer</text>
  <text x="240" y="445" fill="#94a3b8" font-size="8" text-anchor="middle">↖ Own dependencies</text>
  <text x="240" y="465" fill="#94a3b8" font-size="8" text-anchor="middle">↖ Access to __FDE_API__</text>
  <text x="240" y="485" fill="#94a3b8" font-size="8" text-anchor="middle">↖ via window object</text>
  
  <!-- Vite Build -->
  <rect x="420" y="370" width="280" height="140" rx="6" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1"/>
  <text x="560" y="398" fill="white" font-size="11" font-weight="600" text-anchor="middle">Vite Build</text>
  <text x="560" y="425" fill="#94a3b8" font-size="8" text-anchor="middle">• app.tsx (entry point)</text>
  <text x="560" y="445" fill="#94a3b8" font-size="8" text-anchor="middle">• package.json (own deps)</text>
  <text x="560" y="465" fill="#94a3b8" font-size="8" text-anchor="middle">• vite.config.ts</text>
  <text x="560" y="485" fill="#fbbf24" font-size="8" text-anchor="middle">Compiled to dist-apps/{appId}/</text>
  
  <!-- Legend -->
  <text x="400" y="575" fill="#64748b" font-size="9" text-anchor="middle">Custom apps are loaded at runtime from apps/ directory — no framework rebuild needed</text>
</svg>