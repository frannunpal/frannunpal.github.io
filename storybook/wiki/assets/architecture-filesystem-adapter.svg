<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="gd" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#gd)"/>
  
  <!-- Domain Layer Box -->
  <rect x="200" y="20" width="300" height="110" rx="8" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="350" y="45" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Domain Layer</text>
  
  <rect x="220" y="60" width="260" height="55" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="#475569" stroke-width="1"/>
  <text x="350" y="80" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">IFileSystem (Port/Interface)</text>
  <text x="350" y="100" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">getNode(id) · createFile() · createFolder() · delete()</text>
  
  <!-- Arrow -->
  <text x="350" y="150" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">depends on ▼</text>
  
  <!-- Infrastructure Layer Box -->
  <rect x="100" y="170" width="500" height="130" rx="8" fill="rgba(6, 78, 59, 0.2)" stroke="#34d399" stroke-width="1.5"/>
  <text x="350" y="195" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Infrastructure Layer</text>
  
  <!-- IndexedDBFS -->
  <rect x="120" y="210" width="145" height="75" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="192" y="230" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">IndexedDBFS</text>
  <text x="192" y="248" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">(Browser)</text>
  <text x="192" y="263" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">IndexedDB API</text>
  <text x="192" y="277" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Blob storage</text>
  
  <!-- DockerFS -->
  <rect x="277" y="210" width="145" height="75" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="349" y="230" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">DockerFS</text>
  <text x="349" y="248" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">(Container)</text>
  <text x="349" y="263" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">fetch('/api')</text>
  <text x="349" y="277" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">REST endpoints</text>
  
  <!-- ElectronFS -->
  <rect x="435" y="210" width="145" height="75" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="507" y="230" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">ElectronFS</text>
  <text x="507" y="248" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">(Desktop)</text>
  <text x="507" y="263" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Node fs</text>
  <text x="507" y="277" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">electron API</text>
  
  <!-- Legend -->
  <rect x="200" y="320" width="300" height="140" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="350" y="345" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Ports &amp; Adapters Pattern</text>
  
  <text x="220" y="370" fill="#a78bfa" font-size="9" font-family="JetBrains Mono, monospace">• Domain defines Ports (interfaces)</text>
  <text x="220" y="390" fill="#a78bfa" font-size="9" font-family="JetBrains Mono, monospace">• Infrastructure provides Adapters</text>
  <text x="220" y="410" fill="#34d399" font-size="9" font-family="JetBrains Mono, monospace">• Runtime detection selects adapter</text>
  <text x="220" y="430" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">  getRuntime() → 'browser' | 'docker' | 'electron'</text>
  
  <!-- Arrows from Domain to Adapters -->
  <path d="M 280 130 L 192 205" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
  <path d="M 350 130 L 350 205" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
  <path d="M 420 130 L 507 205" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
</svg>