<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Main Thread Container -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="rgba(8, 51, 68, 0.2)" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="40" y="45" fill="#22d3ee" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">Main Thread</text>
  
  <!-- useMapGeneration hook -->
  <rect x="40" y="70" width="160" height="50" rx="6" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="120" y="95" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">useMapGeneration.ts</text>
  <text x="120" y="110" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">React Hook</text>
  
  <!-- citiesStore -->
  <rect x="40" y="180" width="160" height="50" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="120" y="205" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">citiesStore.ts</text>
  <text x="120" y="220" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Zustand</text>
  
  <!-- Arrow from hook to store -->
  <line x1="120" y1="120" x2="120" y2="178" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  
  <!-- MapGenerationWorkerProxy -->
  <rect x="280" y="70" width="220" height="120" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="390" y="95" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">MapGenerationWorkerProxy</text>
  <text x="390" y="115" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">(Comlink)</text>
  
  <rect x="295" y="125" width="190" height="55" rx="4" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="305" y="145" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">- generate(params)</text>
  <text x="305" y="158" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">- cancel()</text>
  <text x="305" y="171" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">- isReady()</text>
  
  <!-- Arrow from hook to proxy -->
  <line x1="200" y1="95" x2="278" y2="95" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  
  <!-- Web Worker Container -->
  <rect x="560" y="140" width="200" height="280" rx="10" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="660" y="165" fill="#fb923c" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Web Worker</text>
  <text x="660" y="182" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">(mapGenerator.worker)</text>
  
  <!-- MapGenerationService inside worker -->
  <rect x="575" y="200" width="170" height="140" rx="6" fill="rgba(30, 41, 59, 0.7)" stroke="#64748b" stroke-width="1"/>
  <text x="660" y="222" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">MapGenerationService</text>
  
  <rect x="585" y="235" width="150" height="95" rx="4" fill="rgba(15, 23, 42, 0.5)"/>
  <text x="595" y="255" fill="#22d3ee" font-size="8" font-family="JetBrains Mono, monospace">- TensorField</text>
  <text x="595" y="270" fill="#34d399" font-size="8" font-family="JetBrains Mono, monospace">- StreamlineGenerator</text>
  <text x="595" y="285" fill="#a78bfa" font-size="8" font-family="JetBrains Mono, monospace">- PolygonFinder</text>
  <text x="595" y="300" fill="#fbbf24" font-size="8" font-family="JetBrains Mono, monospace">- AttributeGenerator</text>
  <text x="595" y="315" fill="#fb7185" font-size="8" font-family="JetBrains Mono, monospace">- BlockSubdivider</text>
  
  <!-- Data boxes below worker -->
  <rect x="575" y="355" width="80" height="50" rx="4" fill="rgba(34, 211, 238, 0.1)" stroke="#22d3ee" stroke-width="1"/>
  <text x="615" y="377" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Data:</text>
  <text x="615" y="392" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Float64Array</text>
  
  <rect x="665" y="355" width="80" height="50" rx="4" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1"/>
  <text x="705" y="377" fill="#fbbf24" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Progress:</text>
  <text x="705" y="392" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">postMessage</text>
  
  <!-- Arrow from proxy to worker -->
  <line x1="500" y1="130" x2="558" y2="200" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="510" y="155" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Comlink.proxy</text>
  
  <!-- Arrow from worker to proxy (response) -->
  <path d="M 558 280 Q 520 280 520 180 Q 520 120 500 120" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-cyan)"/>
  <text x="480" y="135" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">transfer</text>
  
  <!-- Worker to Store callback -->
  <line x1="560" y1="350" x2="200" y2="205" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow-violet)"/>
  <text x="360" y="285" fill="#a78bfa" font-size="8" font-family="JetBrains Mono, monospace">onProgress callback</text>
  
  <!-- Legend -->
  <text x="40" y="430" fill="white" font-size="9" font-weight="600" font-family="JetBrains Mono, monospace">Legend:</text>
  <line x1="40" y1="445" x2="60" y2="445" stroke="#34d399" stroke-width="1.5"/>
  <text x="65" y="448" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">RPC call (Comlink)</text>
  <line x1="180" y1="445" x2="200" y2="445" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="205" y="448" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Data transfer</text>
  <line x1="320" y1="445" x2="340" y2="445" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="345" y="448" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Callback</text>
</svg>