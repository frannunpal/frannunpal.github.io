<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Main Container: fran-desktop/ -->
  <rect x="20" y="20" width="910" height="680" rx="12" fill="rgba(8, 51, 68, 0.2)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="40" y="50" fill="#22d3ee" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">fran-desktop/</text>
  
  <!-- packages/ container -->
  <rect x="40" y="70" width="550" height="540" rx="10" fill="rgba(6, 78, 59, 0.15)" stroke="#34d399" stroke-width="1.5"/>
  <text x="60" y="95" fill="#34d399" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace">packages/</text>
  
  <!-- core/ container -->
  <rect x="60" y="110" width="510" height="480" rx="8" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="80" y="135" fill="#fbbf24" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">core/ — @fde-desktop/fde-core</text>
  
  <!-- src/ container inside core -->
  <rect x="80" y="150" width="470" height="420" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="100" y="175" fill="#94a3b8" font-size="10" font-weight="500" font-family="JetBrains Mono, monospace">src/</text>
  
  <!-- Components inside core/src/ -->
  <rect x="100" y="190" width="210" height="360" rx="4" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="110" y="210" fill="#22d3ee" font-size="9" font-weight="500" font-family="JetBrains Mono, monospace">components/</text>
  <text x="115" y="230" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">• UI components</text>
  <text x="115" y="245" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">• Window, Taskbar</text>
  <text x="115" y="260" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">• Desktop, Launcher</text>
  <text x="115" y="275" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">• Apps/</text>
  
  <rect x="100" y="290" width="210" height="40" rx="4" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="110" y="310" fill="#34d399" font-size="9" font-weight="500" font-family="JetBrains Mono, monospace">apps/</text>
  <text x="115" y="323" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Core apps (Files, Settings...)</text>
  
  <rect x="100" y="340" width="100" height="35" rx="4" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="110" y="360" fill="#a78bfa" font-size="9" font-family="JetBrains Mono, monospace">domain/</text>
  <text x="110" y="372" fill="#94a3b8" font-size="7" font-family="JetBrains Mono, monospace">Entities</text>
  
  <rect x="210" y="340" width="100" height="35" rx="4" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="220" y="360" fill="#a78bfa" font-size="9" font-family="JetBrains Mono, monospace">infrastructure/</text>
  <text x="220" y="372" fill="#94a3b8" font-size="7" font-family="JetBrains Mono, monospace">Adapters</text>
  
  <rect x="100" y="385" width="100" height="35" rx="4" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="110" y="405" fill="#22d3ee" font-size="9" font-family="JetBrains Mono, monospace">stores/</text>
  <text x="110" y="417" fill="#94a3b8" font-size="7" font-family="JetBrains Mono, monospace">Zustand</text>
  
  <rect x="210" y="385" width="100" height="35" rx="4" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="220" y="405" fill="#22d3ee" font-size="9" font-family="JetBrains Mono, monospace">hooks/</text>
  <text x="220" y="417" fill="#94a3b8" font-size="7" font-family="JetBrains Mono, monospace">React hooks</text>
  
  <rect x="100" y="430" width="210" height="35" rx="4" fill="rgba(30, 41, 59, 0.6)" stroke="#475569" stroke-width="1"/>
  <text x="110" y="450" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">constants/ · types/ · interfaces/</text>
  <text x="110" y="462" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">i18n/ · utils/</text>
  
  <rect x="100" y="475" width="210" height="30" rx="4" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="205" y="495" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">index.ts — Public API</text>
  
  <!-- Right side: Other dirs in src/ -->
  <rect x="320" y="190" width="80" height="35" rx="4" fill="rgba(30, 41, 59, 0.6)" stroke="#475569" stroke-width="1"/>
  <text x="325" y="210" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">server/</text>
  
  <rect x="410" y="190" width="130" height="35" rx="4" fill="rgba(30, 41, 59, 0.6)" stroke="#475569" stroke-width="1"/>
  <text x="420" y="210" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Shared/</text>
  
  <rect x="320" y="235" width="220" height="75" rx="4" fill="rgba(30, 41, 59, 0.4)" stroke="#475569" stroke-width="1"/>
  <text x="340" y="255" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">Testing/</text>
  <text x="340" y="270" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">makeWindow, renderWithMantine</text>
  <text x="340" y="285" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">resetDesktopStore</text>
  
  <!-- src/ Example App -->
  <rect x="610" y="70" width="310" height="540" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="630" y="95" fill="#94a3b8" font-size="12" font-weight="600" font-family="JetBrains Mono, monospace">src/ — Example App</text>
  
  <!-- App.tsx and main.tsx -->
  <rect x="630" y="110" width="130" height="40" rx="4" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="695" y="133" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">App.tsx</text>
  
  <rect x="770" y="110" width="130" height="40" rx="4" fill="rgba(30, 41, 59, 0.6)" stroke="#475569" stroke-width="1"/>
  <text x="835" y="133" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">main.tsx</text>
  
  <!-- Presentation/ -->
  <rect x="630" y="165" width="270" height="120" rx="6" fill="rgba(6, 78, 59, 0.2)" stroke="#34d399" stroke-width="1"/>
  <text x="650" y="185" fill="#34d399" font-size="9" font-weight="500" font-family="JetBrains Mono, monospace">Presentation/</text>
  
  <rect x="650" y="200" width="230" height="70" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="660" y="220" fill="#22d3ee" font-size="9" font-family="JetBrains Mono, monospace">Apps/</text>
  <text x="665" y="235" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">WelcomeApp, LinkedinApp</text>
  <text x="665" y="250" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">GithubApp, DosEmulatorApp</text>
  <text x="665" y="265" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">...</text>
  
  <!-- Infrastructure/ -->
  <rect x="630" y="300" width="270" height="80" rx="6" fill="rgba(76, 29, 149, 0.2)" stroke="#a78bfa" stroke-width="1"/>
  <text x="650" y="320" fill="#a78bfa" font-size="9" font-weight="500" font-family="JetBrains Mono, monospace">Infrastructure/</text>
  
  <rect x="650" y="335" width="230" height="35" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="660" y="357" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Adapters/JsDosAdapter.ts</text>
  
  <!-- Arrow from App.tsx to FdeDesktop -->
  <path d="M 630 130 Q 590 130 590 200 L 315 200" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="430" y="190" fill="#34d399" font-size="8" font-family="JetBrains Mono, monospace">imports FdeDesktop</text>
  
  <!-- Window/AppRegistry -->
  <rect x="630" y="395" width="270" height="50" rx="6" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="650" y="415" fill="#22d3ee" font-size="9" font-weight="500" font-family="JetBrains Mono, monospace">Window/AppRegistry.tsx</text>
  <text x="650" y="432" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">userApps — custom app registry</text>
  
  <!-- customApps prop -->
  <line x1="630" y1="135" x2="590" y2="135" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="590" y1="135" x2="590" y2="420" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="590" y1="420" x2="315" y2="420" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="250" fill="#fbbf24" font-size="8" font-family="JetBrains Mono, monospace">customApps prop</text>
  
  <!-- Legend -->
  <rect x="40" y="620" width="300" height="70" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="60" y="645" fill="white" font-size="10" font-weight="600" font-family="JetBrains Mono, monospace">Legend</text>
  
  <rect x="60" y="655" width="16" height="10" rx="2" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="82" y="664" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">UI/Presentation</text>
  
  <rect x="170" y="655" width="16" height="10" rx="2" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="192" y="664" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Core apps</text>
  
  <rect x="260" y="655" width="16" height="10" rx="2" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="282" y="664" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Domain</text>
</svg>