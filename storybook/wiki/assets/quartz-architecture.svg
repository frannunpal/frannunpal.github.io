<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="g20" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#g20)"/>
  
  <!-- wiki/ content -->
  <rect x="10" y="15" width="140" height="50" rx="4" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="80" y="40" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">wiki/</text>
  <text x="80" y="55" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">51 pages</text>
  
  <!-- symlink arrow -->
  <path d="M 150 40 L 170 40" stroke="#64748b" stroke-width="1" marker-end="url(#arr4)"/>
  <text x="160" y="35" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">symlink</text>
  
  <!-- quartz/content -->
  <rect x="175" y="15" width="140" height="50" rx="4" fill="rgba(76, 29, 149, 0.25)" stroke="#a78bfa" stroke-width="1"/>
  <text x="245" y="40" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">quartz/content/</text>
  <text x="245" y="55" fill="#94a3b8" font-size="7" text-anchor="middle">Quartz reads</text>
  
  <!-- build arrow -->
  <path d="M 315 40 L 335 40" stroke="#64748b" stroke-width="1" marker-end="url(#arr4)"/>
  <text x="325" y="30" fill="#64748b" font-size="6" font-family="JetBrains Mono, monospace">npx</text>
  <text x="325" y="55" fill="#64748b" font-size="6" font-family="JetBrains Mono, monospace">quartz build</text>
  
  <!-- quartz/public -->
  <rect x="340" y="15" width="140" height="50" rx="4" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1"/>
  <text x="410" y="40" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">quartz/public/</text>
  <text x="410" y="55" fill="#94a3b8" font-size="7" text-anchor="middle">HTML static</text>
  
  <!-- vite copy arrow -->
  <path d="M 480 40 L 500 40" stroke="#64748b" stroke-width="1" marker-end="url(#arr4)"/>
  <text x="490" y="55" fill="#64748b" font-size="6" font-family="JetBrains Mono, monospace">vite-plugin-static-copy</text>
  
  <!-- dist/wiki -->
  <rect x="505" y="15" width="100" height="50" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="555" y="40" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">dist/wiki/</text>
  <text x="555" y="55" fill="#94a3b8" font-size="7" text-anchor="middle">/wiki/</text>
  
  <!-- WikiApp section -->
  <rect x="10" y="90" width="380" height="110" rx="6" fill="rgba(8, 51, 68, 0.2)" stroke="#22d3ee" stroke-width="1"/>
  <text x="25" y="115" fill="#22d3ee" font-size="10" font-weight="600" font-family="JetBrains Mono, monospace">packages/core/src/components/Apps/WikiApp/</text>
  
  <rect x="25" y="130" width="170" height="55" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="110" y="155" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">WikiApp.tsx</text>
  <text x="110" y="172" fill="#94a3b8" font-size="7" text-anchor="middle">iframe + postMessage</text>
  
  <rect x="205" y="130" width="170" height="55" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="290" y="155" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">WikiApp.module.css</text>
  <text x="290" y="172" fill="#94a3b8" font-size="7" text-anchor="middle">Full-screen styles</text>
  
  <!-- AppRegistry -->
  <rect x="410" y="90" width="280" height="110" rx="6" fill="rgba(76, 29, 149, 0.15)" stroke="#a78bfa" stroke-width="1"/>
  <text x="550" y="115" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">AppRegistry.tsx</text>
  
  <rect x="430" y="130" width="235" height="55" rx="4" fill="rgba(30, 41, 59, 0.6)" stroke="#475569" stroke-width="1"/>
  <text x="547" y="155" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">wiki: {...}</text>
  <text x="547" y="172" fill="#94a3b8" font-size="7" text-anchor="middle">App registration</text>
  
  <!-- Connection -->
  <path d="M 555 65 L 555 90" stroke="#64748b" stroke-width="1"/>
  <path d="M 190 200 L 190 220 L 350 220 L 350 90 L 400 90" stroke="#64748b" stroke-width="1" stroke-dasharray="5,3"/>
  
  <!-- Bottom note -->
  <rect x="10" y="220" width="680" height="35" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="350" y="242" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Quartz 4 → HTML estático → Vite → iframe → postMessage (dark mode sync)</text>
</svg>