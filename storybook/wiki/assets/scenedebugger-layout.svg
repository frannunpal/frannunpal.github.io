<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Main Panel Container -->
  <rect x="20" y="20" width="660" height="340" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Title Bar -->
  <rect x="20" y="20" width="660" height="32" rx="8" fill="rgba(30, 41, 59, 0.8)"/>
  <rect x="20" y="44" width="660" height="8" fill="rgba(30, 41, 59, 0.8)"/>
  <text x="350" y="42" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">DevTools Panel — position: absolute, right: 0 | Width: 660px (280px + 380px), z-index: 100</text>
  
  <!-- Left Panel: HIERARCHY -->
  <rect x="30" y="60" width="270" height="290" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="165" y="82" fill="#22d3ee" font-size="14" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">HIERARCHY</text>
  
  <!-- Search Box -->
  <rect x="40" y="95" width="250" height="28" rx="4" fill="rgba(30, 41, 59, 0.8)" stroke="#475569" stroke-width="1"/>
  <text x="55" y="114" fill="#64748b" font-size="11" font-family="JetBrains Mono, monospace">🔍 Search...</text>
  
  <!-- Tree Items -->
  <text x="50" y="145" fill="#e2e8f0" font-size="10" font-family="JetBrains Mono, monospace">▸ AmbientLight</text>
  <text x="50" y="162" fill="#e2e8f0" font-size="10" font-family="JetBrains Mono, monospace">▸ DirectLight</text>
  <text x="50" y="179" fill="#22d3ee" font-size="10" font-family="JetBrains Mono, monospace">▾ Group</text>
  <text x="70" y="196" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">  ▸ Mesh</text>
  <text x="70" y="213" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">  ▸ Mesh</text>
  <text x="50" y="230" fill="#e2e8f0" font-size="10" font-family="JetBrains Mono, monospace">▸ BoxHelper</text>
  
  <!-- Toggle Buttons -->
  <rect x="40" y="250" width="60" height="24" rx="4" fill="rgba(34, 211, 238, 0.2)" stroke="#22d3ee" stroke-width="1"/>
  <text x="70" y="266" fill="#22d3ee" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">BBox</text>
  <rect x="105" y="250" width="60" height="24" rx="4" fill="rgba(34, 211, 238, 0.2)" stroke="#22d3ee" stroke-width="1"/>
  <text x="135" y="266" fill="#22d3ee" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">Wire</text>
  
  <!-- Stats Footer -->
  <rect x="40" y="285" width="250" height="55" rx="4" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="50" y="305" fill="#fbbf24" font-size="10" font-weight="500" font-family="JetBrains Mono, monospace">FPS: 60</text>
  <text x="130" y="305" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Tris: 1.2M</text>
  <text x="220" y="305" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Calls: 42</text>
  
  <!-- Right Panel: PROPERTIES -->
  <rect x="310" y="60" width="360" height="290" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="490" y="82" fill="#34d399" font-size="14" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">PROPERTIES</text>
  
  <!-- No Selection State -->
  <rect x="320" y="95" width="340" height="40" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="490" y="120" fill="#64748b" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">[no selection] → Theatre groups:</text>
  
  <!-- Theatre Groups -->
  <rect x="320" y="145" width="340" height="100" rx="4" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="330" y="165" fill="#94a3b8" font-size="9" font-family="JetBrains Mono, monospace">Lighting / Sky / Z Layers /</text>
  <text x="330" y="180" fill="#94a3b8" font-size="9" font-family="JetBrains Mono, monospace">Roads / Materials / Camera /</text>
  <text x="330" y="195" fill="#94a3b8" font-size="9" font-family="JetBrains Mono, monospace">Environment / Post-processing</text>
  <rect x="330" y="210" width="320" height="25" rx="3" fill="rgba(34, 211, 238, 0.1)"/>
  <text x="490" y="227" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">slider controls for each group</text>
  
  <!-- Object Selected State -->
  <rect x="320" y="255" width="340" height="85" rx="4" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="330" y="275" fill="#34d399" font-size="10" font-weight="500" font-family="JetBrains Mono, monospace">[object selected]</text>
  <text x="330" y="292" fill="#fbbf24" font-size="9" font-family="JetBrains Mono, monospace">→ Transform (pos/rot/scale edit)</text>
  <text x="330" y="307" fill="#a78bfa" font-size="9" font-family="JetBrains Mono, monospace">→ Material (color/rough/metal)</text>
  <text x="330" y="322" fill="#94a3b8" font-size="9" font-family="JetBrains Mono, monospace">→ Info (type, UUID, visible)</text>
</svg>