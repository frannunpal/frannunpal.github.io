  <!-- ScenePropertiesPanel -->
  <rect x="590" y="310" width="140" height="70" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="660" y="335" fill="#94a3b8" font-size="8" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">ScenePropertiesPanel</text>
  <text x="660" y="355" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">useTheatreValues</text>
  <text x="660" y="370" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">9 Theatre groups</text>
  
  <!-- TheatreEditorSheetProvider -->
  <rect x="480" y="400" width="240" height="50" rx="4" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="600" y="425" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">TheatreEditorSheetProvider</text>
  <text x="600" y="440" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Theatre.js sheet context</text>
  
  <!-- SceneDebuggerScanner -->
  <rect x="40" y="480" width="200" height="55" rx="4" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="140" y="505" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">SceneDebuggerScanner</text>
  <text x="140" y="522" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">populates sceneDebugStore</text>
  
  <!-- BoundingBoxHelper -->
  <rect x="260" y="480" width="200" height="55" rx="4" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="360" y="505" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">BoundingBoxHelper</text>
  <text x="360" y="522" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Box3Helper (selected)</text>
  
  <!-- Arrows -->
  <line x1="140" y1="190" x2="130" y2="205" stroke="#64748b" stroke-width="1" marker-end="url(#a4)"/>
  <line x1="360" y1="190" x2="315" y2="205" stroke="#64748b" stroke-width="1" marker-end="url(#a4)"/>
  <line x1="500" y1="290" x2="490" y2="305" stroke="#64748b" stroke-width="1" marker-end="url(#a4)"/>
  <line x1="600" y1="190" x2="600" y2="395" stroke="#64748b" stroke-width="1" marker-end="url(#a4)"/>
  <line x1="600" y1="450" x2="240" y2="500" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="600" y1="450" x2="460" y2="500" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
  
  <!-- Legend -->
  <rect x="40" y="555" width="310" height="40" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="60" y="575" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">Source of truth: citiesStore (Zustand, persisted)</text>
  <text x="60" y="588" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">Theatre is a mirror — bidirectional sync via onValuesChange</text>
</svg>