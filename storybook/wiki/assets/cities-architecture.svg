  <text x="360" y="175" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">3-column wrapper</text>
  
  <!-- Canvas -->
  <rect x="480" y="130" width="240" height="60" rx="5" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="600" y="155" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Canvas (R3F)</text>
  <text x="600" y="175" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Three.js renderer</text>
  
