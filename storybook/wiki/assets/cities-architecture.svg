  <text x="315" y="255" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Canvas wrapper</text>
  <text x="315" y="275" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">pass-through</text>
  
