<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 620">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="g4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#g4)"/>
  
  <!-- CitiesApp -->
  <rect x="20" y="15" width="710" height="50" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="375" y="45" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">CitiesApp</text>
  
  <!-- MapCanvas3D Container -->
  <rect x="20" y="85" width="710" height="520" rx="8" fill="rgba(6, 78, 59, 0.15)" stroke="#34d399" stroke-width="1"/>
  <text x="40" y="110" fill="#34d399" font-size="11" font-weight="500" font-family="JetBrains Mono, monospace">MapCanvas3D</text>
  
  <!-- TheatreEditorProvider -->
  <rect x="40" y="130" width="200" height="60" rx="5" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="140" y="155" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">TheatreEditorProvider</text>
  <text x="140" y="175" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">null-render · studio init</text>
  
  <!-- SceneInspectorLayout -->
  <rect x="260" y="130" width="200" height="60" rx="5" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
