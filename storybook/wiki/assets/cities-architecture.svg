  <rect x="40" y="210" width="180" height="80" rx="4" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1"/>
  <text x="130" y="235" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">HierarchyPanel</text>
  <text x="130" y="255" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">sceneDebugStore</text>
  <text x="130" y="275" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">tree + search + stats</text>
  
  <!-- ChildrenWrapper -->
  <rect x="240" y="210" width="150" height="80" rx="4" fill="rgba(30, 41, 59, 0.6)" stroke="#475569" stroke-width="1"/>
