<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520">
  <defs>
    <marker id="arr1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <pattern id="g1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#g1)"/>
  
  <!-- Container -->
  <rect x="30" y="20" width="690" height="340" rx="12" fill="rgba(251, 146, 60, 0.1)" stroke="#fb923c" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="50" y="50" fill="#fb923c" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">Unified Architecture (Dev &amp; Prod)</text>
  
  <!-- Entrypoint -->
  <rect x="50" y="65" width="650" height="55" rx="6" fill="rgba(30, 41, 59, 0.7)" stroke="#475569" stroke-width="1"/>
  <text x="375" y="88" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Entrypoint (entrypoint.sh)</text>
  <text x="375" y="105" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Start as root → Inject Docker flags → Fix volume ownership → exec gosu bun:bun</text>
  
  <!-- supervisord -->
  <rect x="50" y="135" width="650" height="210" rx="8" fill="rgba(120, 53, 15, 0.2)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="70" y="158" fill="#fbbf24" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">Supervisord (manages all processes)</text>
  
  <!-- nginx -->
  <rect x="75" y="180" width="145" height="80" rx="6" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="147" y="202" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">nginx</text>
  <text x="147" y="218" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">port 8080</text>
  <text x="147" y="233" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">proxies /api/*</text>
  <text x="147" y="248" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">→ localhost:3001</text>
  
  <!-- api -->
  <rect x="235" y="180" width="145" height="80" rx="6" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1.5"/>
  <text x="307" y="202" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">api</text>
  <text x="307" y="218" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">port 3001</text>
  <text x="307" y="233" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">REST API</text>
  <text x="307" y="248" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">+ WebSocket</text>
  
  <!-- watcher -->
  <rect x="395" y="180" width="145" height="80" rx="6" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="467" y="202" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">watcher</text>
  <text x="467" y="218" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">chokidar</text>
  <text x="467" y="233" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Rebuilds apps</text>
  <text x="467" y="248" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">when ./apps/* changes</text>
  
  <!-- vite -->
  <rect x="555" y="180" width="125" height="80" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="#64748b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="617" y="202" fill="#64748b" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">[vite]</text>
  <text x="617" y="218" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Dev only</text>
  <text x="617" y="233" fill="#475569" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Vite dev server</text>
  <text x="617" y="248" fill="#475569" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">for HMR</text>
  
  <!-- Arrows -->
  <line x1="375" y1="120" x2="375" y2="132" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr1)"/>
  
  <!-- Dev box -->
  <rect x="100" y="375" width="250" height="120" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="225" y="400" fill="#22d3ee" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Dev</text>
  <text x="225" y="425" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Source bind mounted</text>
  <text x="225" y="445" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">/app/index.html</text>
  <text x="225" y="462" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Vite serves with HMR</text>
  <text x="225" y="479" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Full node_modules</text>
  
  <!-- Prod box -->
  <rect x="400" y="375" width="250" height="120" rx="8" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1.5"/>
  <text x="525" y="400" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Prod</text>
  <text x="525" y="425" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Bundled server</text>
  <text x="525" y="445" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">/usr/share/nginx/html/</text>
  <text x="525" y="462" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Static files in image</text>
  <text x="525" y="479" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">No source code!</text>
</svg>