<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="g3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#g3)"/>

  <!-- CitiesApp -->
  <rect x="30" y="20" width="840" height="440" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="450" y="48" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">CitiesApp — View Layout</text>

  <!-- InfoSidebar (LEFT) -->
  <rect x="50" y="70" width="240" height="370" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="170" y="95" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">InfoSidebar</text>
  <text x="170" y="115" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">left panel · 240px</text>

  <!-- InfoSidebar sections -->
  <rect x="65" y="130" width="210" height="40" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="170" y="150" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Seed Input + Generation Controls</text>
  <text x="170" y="163" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">regenerate, neighborhood list</text>

  <rect x="65" y="180" width="210" height="40" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="170" y="200" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Sun Controls</text>
  <text x="170" y="213" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">angle · elevation · intensity</text>

  <rect x="65" y="230" width="210" height="40" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="170" y="250" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Location Controls</text>
  <text x="170" y="263" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">search · coordinates · color</text>

  <rect x="65" y="280" width="210" height="40" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="170" y="300" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Day/Night Controls</text>
  <text x="170" y="313" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">cycle speed · pause</text>

  <rect x="65" y="330" width="210" height="40" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="170" y="350" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Building Info</text>
  <text x="170" y="363" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">attributes · metadata</text>

  <!-- Generation History -->
  <rect x="65" y="380" width="210" height="40" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="170" y="400" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Generation History</text>
  <text x="170" y="413" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">max 20 · FIFO</text>

  <!-- DeckGLMap (CENTER + RIGHT) -->
  <rect x="310" y="70" width="540" height="370" rx="6" fill="rgba(6, 78, 59, 0.2)" stroke="#34d399" stroke-width="1.5"/>
  <text x="330" y="95" fill="#34d399" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">DeckGLMap (flex: 1)</text>

  <!-- Map area -->
  <rect x="330" y="115" width="220" height="310" rx="4" fill="rgba(30, 41, 59, 0.4)" stroke="#475569" stroke-width="1"/>
  <text x="440" y="270" fill="#64748b" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">MapLibre GL</text>
  <text x="440" y="288" fill="#475569" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">OpenFreeMap</text>

  <!-- DeckGL layers overlay -->
  <text x="440" y="320" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">DeckGL layers overlay</text>

  <!-- CitiesTheatre overlay (RIGHT side) -->
  <rect x="570" y="115" width="260" height="310" rx="5" fill="rgba(76, 29, 149, 0.25)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="700" y="140" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">CitiesTheatre</text>
  <text x="700" y="158" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">100% Mantine overlay · toggle ON/OFF</text>

  <!-- CitiesTheatre sections -->
  <rect x="585" y="175" width="230" height="30" rx="3" fill="rgba(76, 29, 149, 0.15)" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="700" y="195" fill="#c4b5fd" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Toolbar — search · play/pause · reset</text>

  <rect x="585" y="212" width="230" height="60" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="0.8"/>
  <text x="700" y="232" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Hierarchy (left panel 180px)</text>
  <text x="700" y="250" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Lighting · Sky · Stars · Fog</text>
  <text x="700" y="265" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Post-processing · Camera · Debug</text>

  <rect x="585" y="280" width="230" height="60" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="0.8"/>
  <text x="700" y="300" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Properties (right panel)</text>
  <text x="700" y="318" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Slider + NumberInput per prop</text>
  <text x="700" y="333" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">read/write via citiesStore</text>

  <rect x="585" y="348" width="230" height="40" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="0.8"/>
  <text x="700" y="368" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Geometry — opacity per layer</text>
  <text x="700" y="382" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Buildings · Parks · Roads · River · Sea</text>

  <!-- StatusBar -->
  <rect x="585" y="396" width="230" height="20" rx="3" fill="rgba(30, 41, 59, 0.4)" stroke="#475569" stroke-width="0.5"/>
  <text x="700" y="411" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Status: ready</text>

  <!-- Legend -->
  <rect x="310" y="445" width="540" height="15" rx="3" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="580" y="456" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">CitiesTheatre is toggleable overlay · no Theatre.js runtime · all state in citiesStore (Zustand)</text>
</svg>