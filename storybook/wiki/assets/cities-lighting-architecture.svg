<svg viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, monospace">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arrowhead-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee" />
    </marker>
    <marker id="arrowhead-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
    </marker>
    <marker id="arrowhead-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#020617" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- SettingsPanel (input source) -->
  <rect x="40" y="60" width="180" height="90" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="84" fill="white" font-size="11" font-weight="600" text-anchor="middle">SettingsPanel</text>
  <text x="130" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">Date picker · Time slider</text>
  <text x="130" y="114" fill="#94a3b8" font-size="9" text-anchor="middle">Save/Load JSON</text>
  <text x="130" y="135" fill="#22d3ee" font-size="8" text-anchor="middle">simulationDate + timeOfDay</text>

  <!-- Calendar group (old, still available) -->
  <rect x="40" y="180" width="180" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="130" y="204" fill="white" font-size="10" font-weight="600" text-anchor="middle">Calendar (legacy)</text>
  <text x="130" y="220" fill="#94a3b8" font-size="9" text-anchor="middle">simulationDate</text>

  <!-- SunCalc (astronomy engine) -->
  <rect x="310" y="120" width="200" height="80" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="410" y="144" fill="white" font-size="11" font-weight="600" text-anchor="middle">SunCalc</text>
  <text x="410" y="160" fill="#94a3b8" font-size="9" text-anchor="middle">SunCalculationService</text>
  <text x="410" y="176" fill="#34d399" font-size="8" text-anchor="middle">npm: suncalc ^1.9.0</text>

  <!-- Zustand Store -->
  <rect x="310" y="240" width="200" height="100" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="410" y="264" fill="white" font-size="12" font-weight="600" text-anchor="middle">Cities Store</text>
  <text x="410" y="284" fill="#94a3b8" font-size="9" text-anchor="middle">sunAngle · sunElevation</text>
  <text x="410" y="298" fill="#94a3b8" font-size="9" text-anchor="middle">ambientIntensity · dirIntensity</text>
  <text x="410" y="312" fill="#94a3b8" font-size="9" text-anchor="middle">timeOfDay · simulationDate</text>
  <text x="410" y="326" fill="#fbbf24" font-size="8" text-anchor="middle">persist → localStorage v5</text>

  <!-- DeckGLMap (React component) -->
  <rect x="600" y="60" width="220" height="90" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="710" y="84" fill="white" font-size="11" font-weight="600" text-anchor="middle">DeckGLMap.tsx</text>
  <text x="710" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">useEffect sync</text>
  <text x="710" y="114" fill="#22d3ee" font-size="8" text-anchor="middle">timeOfDay → sunAngle + sunElevation</text>
  <text x="710" y="135" fill="#22d3ee" font-size="7" text-anchor="middle">getSunAnglesFromTimeOfDayAndCoords()</text>

  <!-- Scene Graph Pipeline -->
  <rect x="600" y="190" width="220" height="70" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="710" y="214" fill="white" font-size="11" font-weight="600" text-anchor="middle">Scene Graph Pipeline</text>
  <text x="710" y="230" fill="#94a3b8" font-size="9" text-anchor="middle">buildSceneGraphPipeline()</text>
  <text x="710" y="246" fill="#a78bfa" font-size="8" text-anchor="middle">sceneNodes + sceneCtx → effects</text>

  <!-- Scene Context -->
  <rect x="600" y="290" width="220" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="710" y="312" fill="white" font-size="10" font-weight="600" text-anchor="middle">SceneContext</text>
  <text x="710" y="328" fill="#94a3b8" font-size="9" text-anchor="middle">getSunDirection() → negated</text>

  <!-- DeckGLOverlay -->
  <rect x="870" y="60" width="200" height="70" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="970" y="84" fill="white" font-size="11" font-weight="600" text-anchor="middle">DeckGLOverlay</text>
  <text x="970" y="100" fill="#94a3b8" font-size="9" text-anchor="middle">MapboxOverlay (IControl)</text>
  <text x="970" y="116" fill="#22d3ee" font-size="8" text-anchor="middle">overlay.setProps({effects})</text>

  <!-- LightingEffect -->
  <rect x="870" y="160" width="200" height="70" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="970" y="184" fill="white" font-size="11" font-weight="600" text-anchor="middle">LightingEffect</text>
  <text x="970" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">AmbientLight + DirectionalLight</text>
  <text x="970" y="216" fill="#fbbf24" font-size="8" text-anchor="middle">Directional follows SunCalc</text>

  <!-- SolidPolygonLayer (Buildings) -->
  <rect x="870" y="260" width="200" height="80" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="970" y="284" fill="white" font-size="11" font-weight="600" text-anchor="middle">SolidPolygonLayer</text>
  <text x="970" y="300" fill="#94a3b8" font-size="9" text-anchor="middle">extruded: true</text>
  <text x="970" y="314" fill="#fb7185" font-size="8" text-anchor="middle">material: {ambient:0.3, diffuse:0.7}</text>
  <text x="970" y="328" fill="#fb7185" font-size="8" text-anchor="middle">getLineColor → wireframeColor</text>

  <!-- Mapbox Native Lights -->
  <rect x="870" y="375" width="200" height="70" rx="8" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="970" y="399" fill="white" font-size="11" font-weight="600" text-anchor="middle">Mapbox Native Lights</text>
  <text x="970" y="415" fill="#94a3b8" font-size="9" text-anchor="middle">map.setLights()</text>
  <text x="970" y="431" fill="#fb923c" font-size="8" text-anchor="middle">ambient + directional + shadows</text>

  <!-- AmbientLight scene node -->
  <rect x="40" y="360" width="180" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="130" y="384" fill="white" font-size="10" font-weight="600" text-anchor="middle">AmbientLight (scene node)</text>
  <text x="130" y="400" fill="#94a3b8" font-size="8" text-anchor="middle">intensity: 0.5 → mat×0.3 = 0.15 base</text>

  <!-- DirectionalLight scene node -->
  <rect x="40" y="440" width="180" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="130" y="464" fill="white" font-size="10" font-weight="600" text-anchor="middle">DirectionalLight (scene node)</text>
  <text x="130" y="480" fill="#94a3b8" font-size="8" text-anchor="middle">intensity: 1.5 → mat×0.7 = 1.05 ndotl</text>

  <!-- CSS Effects -->
  <rect x="600" y="400" width="220" height="70" rx="6" fill="rgba(251, 146, 60, 0.2)" stroke="#fb923c" stroke-width="1"/>
  <text x="710" y="424" fill="white" font-size="10" font-weight="600" text-anchor="middle">CSS Effects (overlay)</text>
  <text x="710" y="440" fill="#94a3b8" font-size="9" text-anchor="middle">vignette · tone-mapping</text>
  <text x="710" y="456" fill="#fb923c" font-size="8" text-anchor="middle">radial-gradient + CSS filter</text>

  <!-- Settings → SunCalc -->
  <line x1="220" y1="105" x2="308" y2="160" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead-cyan)"/>
  <text x="260" y="130" fill="#22d3ee" font-size="8">date + timeOfDay</text>

  <!-- Settings → Store (direct via hook) -->
  <line x1="220" y1="105" x2="308" y2="290" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="250" y="200" fill="#94a3b8" font-size="7">useCitiesStore</text>

  <!-- SunCalc → Store -->
  <line x1="410" y1="200" x2="410" y2="238" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead-emerald)"/>
  <text x="425" y="224" fill="#34d399" font-size="8">azimuth + elevation</text>

  <!-- Store → DeckGLMap -->
  <line x1="510" y1="290" x2="598" y2="105" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>
  <text x="540" y="200" fill="#fbbf24" font-size="8" transform="rotate(30,540,200)">sunAngle, sunElevation</text>

  <!-- DeckGLMap → SceneCtx -->
  <line x1="710" y1="150" x2="710" y2="188" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead-cyan)"/>
  <text x="725" y="174" fill="#22d3ee" font-size="8">sceneCtx</text>

  <!-- SceneCtx → Scene Pipeline -->
  <line x1="710" y1="290" x2="710" y2="260" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Scene Pipeline → LightingEffect -->
  <line x1="820" y1="225" x2="868" y2="195" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead-violet)"/>
  <text x="835" y="220" fill="#a78bfa" font-size="8">effects[]</text>

  <!-- LightingEffect → SolidPolygonLayer -->
  <path d="M 970 230 L 970 258" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>
  <text x="985" y="248" fill="#fbbf24" font-size="8">lighting</text>

  <!-- DeckGLMap → MapboxNative -->
  <path d="M 710 150 L 970 410" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="830" y="360" fill="#fb923c" font-size="8">mapboxSetLights()</text>

  <!-- MapboxNative → basemap -->
  <line x1="970" y1="445" x2="970" y2="500" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="985" y="480" fill="#fb923c" font-size="8">Mapbox terrain</text>

  <!-- Legend -->
  <text x="40" y="560" fill="white" font-size="11" font-weight="600">Legend</text>

  <rect x="40" y="572" width="16" height="10" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="62" y="580" fill="#94a3b8" font-size="9">React Components / UI</text>

  <rect x="40" y="590" width="16" height="10" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="62" y="598" fill="#94a3b8" font-size="9">Services / Astronomy</text>

  <rect x="40" y="608" width="16" height="10" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="62" y="616" fill="#94a3b8" font-size="9">State / Store</text>

  <rect x="200" y="572" width="16" height="10" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="222" y="580" fill="#94a3b8" font-size="9">Pipeline</text>

  <rect x="200" y="590" width="16" height="10" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="222" y="598" fill="#94a3b8" font-size="9">deck.gl Layer</text>

  <rect x="200" y="608" width="16" height="10" rx="2" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1"/>
  <text x="222" y="616" fill="#94a3b8" font-size="9">Mapbox Native</text>

  <line x1="370" y1="576" x2="395" y2="576" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead-cyan)"/>
  <text x="400" y="580" fill="#94a3b8" font-size="9">Data flow</text>

  <line x1="370" y1="594" x2="395" y2="594" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="598" fill="#94a3b8" font-size="9">Indirect / hook binding</text>
</svg>
