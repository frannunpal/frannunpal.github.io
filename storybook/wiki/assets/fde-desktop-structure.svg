<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 280">
  <defs>
    <pattern id="g10" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#g10)"/>
  
  <!-- FdeDesktop root -->
  <rect x="10" y="10" width="530" height="260" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="2"/>
  <text x="30" y="40" fill="#22d3ee" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">FdeDesktop</text>
  
  <!-- Providers -->
  <rect x="30" y="60" width="120" height="50" rx="4" fill="rgba(76, 29, 149, 0.25)" stroke="#a78bfa" stroke-width="1"/>
  <text x="90" y="85" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">MantineProvider</text>
  <text x="90" y="100" fill="#94a3b8" font-size="7" text-anchor="middle">(theme)</text>
  
  <rect x="160" y="60" width="130" height="50" rx="4" fill="rgba(76, 29, 149, 0.25)" stroke="#a78bfa" stroke-width="1"/>
  <text x="225" y="85" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">DragDropProvider</text>
  
  <rect x="300" y="60" width="110" height="50" rx="4" fill="rgba(76, 29, 149, 0.25)" stroke="#a78bfa" stroke-width="1"/>
  <text x="355" y="85" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">I18nProvider</text>
  
  <rect x="420" y="60" width="100" height="50" rx="4" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1"/>
  <text x="470" y="85" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Modals</text>
  
  <!-- Desktop section -->
  <rect x="30" y="130" width="490" height="160" rx="6" fill="rgba(6, 78, 59, 0.2)" stroke="#34d399" stroke-width="1.5"/>
  <text x="50" y="155" fill="#34d399" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">Desktop</text>
  
  <!-- Desktop children -->
  <rect x="50" y="170" width="100" height="45" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="195" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Wallpaper</text>
  
  <rect x="160" y="170" width="120" height="45" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="220" y="195" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">DesktopIcons</text>
  
  <rect x="290" y="170" width="130" height="45" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="355" y="195" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Windows</text>
  
  <rect x="430" y="170" width="80" height="45" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="470" y="195" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Taskbar</text>
  
  <!-- Connection lines -->
  <path d="M 90 110 L 90 135" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 225 110 L 225 135" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 355 110 L 355 135" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 470 110 L 470 135" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
</svg>