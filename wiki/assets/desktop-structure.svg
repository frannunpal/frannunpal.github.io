<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200">
  <defs>
    <pattern id="g11" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#g11)"/>
  
  <!-- Desktop root -->
  <rect x="10" y="10" width="500" height="180" rx="8" fill="rgba(6, 78, 59, 0.25)" stroke="#34d399" stroke-width="2"/>
  <text x="30" y="40" fill="#34d399" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Desktop</text>
  
  <!-- Children -->
  <rect x="30" y="60" width="100" height="55" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="80" y="85" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Wallpaper</text>
  <text x="80" y="100" fill="#94a3b8" font-size="7" text-anchor="middle">background</text>
  
  <rect x="140" y="60" width="110" height="55" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="195" y="85" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">DesktopIcon[]</text>
  <text x="195" y="100" fill="#94a3b8" font-size="7" text-anchor="middle">draggable icons</text>
  
  <rect x="260" y="60" width="120" height="55" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="320" y="85" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Window[]</text>
  <text x="320" y="100" fill="#94a3b8" font-size="7" text-anchor="middle">app windows</text>
  
  <rect x="390" y="60" width="100" height="55" rx="4" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1"/>
  <text x="440" y="85" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Taskbar</text>
  <text x="440" y="100" fill="#94a3b8" font-size="7" text-anchor="middle">fixed bottom</text>
  
  <!-- Hooks section -->
  <rect x="30" y="130" width="460" height="50" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="152" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Hooks:</text>
  <text x="100" y="152" fill="#a78bfa" font-size="8" font-family="JetBrains Mono, monospace">useDesktopStore</text>
  <text x="220" y="152" fill="#a78bfa" font-size="8" font-family="JetBrains Mono, monospace">useSettingsStore</text>
  <text x="340" y="152" fill="#a78bfa" font-size="8" font-family="JetBrains Mono, monospace">useDragDrop</text>
  <text x="50" y="170" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">icons · windows · wallpaper · theme · file drop</text>
</svg>