<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="g2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#g2)"/>
  
  <!-- Dockerfile container -->
  <rect x="30" y="20" width="540" height="580" rx="12" fill="rgba(8, 51, 68, 0.15)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="50" y="50" fill="#22d3ee" font-size="14" font-weight="700" font-family="JetBrains Mono, monospace">Dockerfile</text>
  
  <!-- Stage 1a: deps -->
  <rect x="50" y="70" width="500" height="85" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="70" y="95" fill="#fbbf24" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">Stage 1a: deps</text>
  <text x="70" y="112" fill="white" font-size="9" font-family="JetBrains Mono, monospace">Base: oven/bun:1.2</text>
  <text x="70" y="128" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Full dependencies (electron, playwright, testing)</text>
  <text x="70" y="143" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">Used by: development</text>
  <rect x="450" y="95" width="85" height="20" rx="4" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1"/>
  <text x="492" y="109" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">~1.2GB</text>
  
  <!-- Arrow -->
  <line x1="300" y1="155" x2="300" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>
  
  <!-- Stage 1b: deps-minimal -->
  <rect x="50" y="175" width="500" height="85" rx="6" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="70" y="200" fill="#34d399" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">Stage 1b: deps-minimal</text>
  <text x="70" y="217" fill="white" font-size="9" font-family="JetBrains Mono, monospace">Base: oven/bun:1.2</text>
  <text x="70" y="233" fill="#94a3b8" font-size="8" font-family="JetBrains Mono, monospace">Filtered dependencies (no electron, playwright, tests)</text>
  <text x="70" y="248" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">Used by: builder, build, production</text>
  <rect x="450" y="200" width="85" height="20" rx="4" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1"/>
  <text x="492" y="214" fill="#34d399" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">~500MB</text>
  
  <!-- Arrows -->
  <path d="M 300 155 L 300 175" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>
  
  <!-- Stage 2: development -->
  <rect x="50" y="275" width="240" height="95" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="170" y="300" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Stage 2: development</text>
  <text x="170" y="318" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">oven/bun:1.2 + nginx + supervisord</text>
  <text x="170" y="335" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Full node_modules from deps</text>
  <text x="170" y="350" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Vite dev + API server + Apps watcher</text>
  
  <!-- Stage 3: builder -->
  <rect x="310" y="275" width="240" height="95" rx="6" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="430" y="300" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Stage 3: builder</text>
  <text x="430" y="318" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">oven/bun:1.2</text>
  <text x="430" y="335" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Builds dynamic apps only</text>
  <text x="430" y="350" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Used for: CI/CD</text>
  
  <!-- Stage 4: build -->
  <rect x="310" y="390" width="240" height="95" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="415" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Stage 4: build</text>
  <text x="430" y="433" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">oven/bun:1.2</text>
  <text x="430" y="450" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Vite + TypeScript build</text>
  <text x="430" y="465" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Server bundle + Storybook</text>
  
  <!-- Stage 5: production -->
  <rect x="180" y="505" width="240" height="85" rx="6" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="2"/>
  <text x="300" y="530" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Stage 5: production</text>
  <text x="300" y="548" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">oven/bun:1.2 + supervisord + gosu</text>
  <text x="300" y="565" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Static files + bundled server</text>
  <text x="300" y="580" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Runs as 'bun' user</text>
  
  <!-- Arrows between stages -->
  <path d="M 170 265 L 170 275" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M 430 265 L 430 275" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M 430 370 L 430 390" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M 430 485 L 350 505" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a2)"/>
  
  <!-- Size savings note -->
  <rect x="50" y="505" width="120" height="50" rx="4" fill="rgba(34, 211, 238, 0.1)" stroke="#22d3ee" stroke-width="1"/>
  <text x="110" y="522" fill="#22d3ee" font-size="8" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Size Savings</text>
  <text x="110" y="538" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">~700MB</text>
  <text x="110" y="550" fill="#64748b" font-size="6" text-anchor="middle" font-family="JetBrains Mono, monospace">per prod build</text>
</svg>