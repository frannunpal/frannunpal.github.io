<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="aw-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <pattern id="gw" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#gw)"/>

  <!-- Title -->
  <text x="400" y="30" fill="white" font-size="13" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Cities — Web Worker Architecture</text>

  <!-- Main Thread Boundary -->
  <rect x="20" y="55" width="370" height="405" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="30" y="80" fill="#22d3ee" font-size="10" font-weight="600" font-family="JetBrains Mono, monospace">Main Thread</text>

  <!-- Worker Thread Boundary -->
  <rect x="410" y="55" width="370" height="405" rx="8" fill="rgba(76, 29, 149, 0.25)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="420" y="80" fill="#a78bfa" font-size="10" font-weight="600" font-family="JetBrains Mono, monospace">Web Worker</text>

  <!-- useMapGeneration hook -->
  <rect x="40" y="100" width="330" height="55" rx="5" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="205" y="122" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">useMapGeneration</text>
  <text x="205" y="140" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">React hook · calls generate(params)</text>

  <!-- MapGenerationWorkerProxy -->
  <rect x="40" y="175" width="330" height="65" rx="5" fill="rgba(22, 163, 74, 0.15)" stroke="#22c55e" stroke-width="1"/>
  <text x="205" y="198" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">MapGenerationWorkerProxy</text>
  <text x="205" y="216" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Comlink.wrap() · proxy</text>
  <text x="205" y="230" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">init() · generate() · terminate()</text>

  <!-- Arrow between hook and proxy -->
  <line x1="205" y1="155" x2="205" y2="170" stroke="#64748b" stroke-width="1" marker-end="url(#aw)"/>

  <!-- Zustand store -->
  <rect x="40" y="260" width="330" height="50" rx="5" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="205" y="282" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">citiesStore (Zustand)</text>
  <text x="205" y="298" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">recibe resultados · actualiza UI</text>

  <line x1="205" y1="240" x2="205" y2="255" stroke="#64748b" stroke-width="1" marker-end="url(#aw)"/>

  <!-- Worker side: MapGenerationService -->
  <rect x="430" y="100" width="330" height="70" rx="5" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="595" y="125" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">mapGenerator.worker.ts</text>
  <text x="595" y="143" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Comlink.expose() · worker API</text>

  <!-- Worker sub-services -->
  <rect x="430" y="190" width="330" height="100" rx="5" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="595" y="213" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">MapGenerationService</text>
  <text x="595" y="233" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">TensorField · Streamlines</text>
  <text x="595" y="250" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">PolygonFinder · Buildings</text>
  <text x="595" y="267" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">AttributeGenerator</text>
  <text x="595" y="283" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">pure computation · no DOM</text>

  <!-- Worker progress -->
  <rect x="430" y="310" width="330" height="50" rx="5" fill="rgba(251, 146, 60, 0.2)" stroke="#fb923c" stroke-width="1"/>
  <text x="595" y="333" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">onProgress(phase, pct)</text>
  <text x="595" y="350" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">via Comlink.proxy() callback</text>

  <!-- Data transfer -->
  <rect x="430" y="380" width="330" height="55" rx="5" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="595" y="403" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">result: Float64Array buffers</text>
  <text x="595" y="420" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">zero-copy transfer · serialized Vector2</text>

  <!-- Comlink RPC arrow (main → worker) -->
  <line x1="370" y1="205" x2="425" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#aw)"/>
  <text x="385" y="170" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">Comlink RPC</text>

  <!-- Progress arrow (worker → main) -->
  <line x1="430" y1="335" x2="375" y2="285" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#aw-green)"/>
  <text x="385" y="320" fill="#34d399" font-size="7" font-family="JetBrains Mono, monospace">progress</text>

  <!-- Result arrow (worker → main) -->
  <line x1="430" y1="405" x2="375" y2="285" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#aw)"/>
  <text x="395" y="350" fill="#fbbf24" font-size="7" font-family="JetBrains Mono, monospace">result</text>

  <!-- Fallback text -->
  <rect x="40" y="330" width="330" height="40" rx="4" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="205" y="350" fill="#fb923c" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Fallback: main thread via yieldToMain()</text>
  <text x="205" y="363" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">si Worker no disponible (Node.js tests, etc.)</text>

  <!-- Legend -->
  <rect x="40" y="390" width="330" height="55" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="60" y="410" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">Serialization: Vector2 → Float64Array</text>
  <text x="60" y="425" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">Comlink: RPC-style communication</text>
  <text x="60" y="438" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">UI at 60fps during generation</text>
</svg>