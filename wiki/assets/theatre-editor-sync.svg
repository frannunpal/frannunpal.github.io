<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Zustand Store Box -->
  <rect x="250" y="20" width="400" height="100" rx="8" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="450" y="45" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Zustand Store (Single Source of Truth)</text>
  <text x="270" y="70" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">sunAngle: number</text>
  <text x="270" y="85" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">sunElevation: number</text>
  <text x="270" y="100" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">ambientIntensity: number</text>
  <text x="470" y="70" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">directionalIntensity: number</text>
  <text x="470" y="85" fill="#a78bfa" font-size="9" font-family="JetBrains Mono, monospace"> + setters</text>
  
  <!-- TheatreEditor Box -->
  <rect x="80" y="200" width="200" height="140" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="180" y="225" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">TheatreEditor</text>
  <text x="180" y="245" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">useTheatreValues</text>
  <rect x="100" y="260" width="160" height="60" rx="4" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="110" y="280" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">studio.transaction</text>
  <text x="110" y="295" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">({ set }) => {</text>
  <text x="110" y="310" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">  set(obj.props, value)</text>
  
  <!-- SunControls Box -->
  <rect x="620" y="200" width="200" height="140" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="720" y="225" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">SunControls</text>
  <text x="720" y="245" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">(InfoSidebar)</text>
  <rect x="640" y="260" width="160" height="60" rx="4" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="650" y="280" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">Slider onChange:</text>
  <text x="650" y="295" fill="#34d399" font-size="8" font-family="JetBrains Mono, monospace">→ setSunAngle()</text>
  <text x="650" y="310" fill="#34d399" font-size="8" font-family="JetBrains Mono, monospace">→ setSunElevation()</text>
  
  <!-- Arrows -->
  <!-- Store to TheatreEditor -->
  <line x1="350" y1="120" x2="220" y2="198" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="260" y="155" fill="#94a3b8" font-size="9" font-family="JetBrains Mono, monospace">onValuesChange</text>
  <text x="260" y="170" fill="#a78bfa" font-size="8" font-family="JetBrains Mono, monospace">setSunAngle()</text>
  
  <!-- Store to SunControls -->
  <line x1="550" y1="120" x2="680" y2="198" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="580" y="155" fill="#94a3b8" font-size="9" font-family="JetBrains Mono, monospace">useCitiesStore</text>
  <text x="580" y="170" fill="#a78bfa" font-size="8" font-family="JetBrains Mono, monospace">subscribe</text>
  
  <!-- TheatreEditor to SunControls -->
  <path d="M 280 270 Q 450 270 618 270" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="370" y="260" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">bidirectional sync</text>
  <text x="450" y="375" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">onChange → Zustand → onValuesChange</text>
  
  <!-- Loop Prevention Note -->
  <rect x="200" y="395" width="500" height="20" rx="4" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1"/>
  <text x="450" y="409" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">isUpdatingFromTheatreRef prevents infinite loops</text>
</svg>