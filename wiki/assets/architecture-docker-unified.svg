<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#g)"/>
  
  <!-- Container Box -->
  <rect x="30" y="20" width="640" height="480" rx="12" fill="rgba(251, 146, 60, 0.1)" stroke="#fb923c" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="50" y="50" fill="#fb923c" font-size="12" font-weight="700" font-family="JetBrains Mono, monospace">Unified Architecture (Dev &amp; Prod)</text>
  
  <!-- Entry Point -->
  <rect x="50" y="70" width="600" height="40" rx="6" fill="rgba(30, 41, 59, 0.7)" stroke="#475569" stroke-width="1"/>
  <text x="350" y="95" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Entry: root → fix volumes → gosu bun → supervisord</text>
  
  <!-- supervisord box -->
  <rect x="50" y="130" width="600" height="250" rx="8" fill="rgba(120, 53, 15, 0.2)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="70" y="155" fill="#fbbf24" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">supervisord</text>
  
  <!-- nginx -->
  <rect x="80" y="180" width="180" height="80" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="170" y="205" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">nginx (port 8080)</text>
  <rect x="90" y="215" width="160" height="35" rx="4" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="170" y="230" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">proxies /api/* → localhost:3001</text>
  <text x="170" y="243" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">serves static files</text>
  
  <!-- api-server -->
  <rect x="280" y="180" width="180" height="80" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="370" y="205" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">api (port 3001)</text>
  <rect x="290" y="215" width="160" height="35" rx="4" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="370" y="230" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">REST API + WebSocket</text>
  <text x="370" y="243" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">fs, pty, hmr handlers</text>
  
  <!-- watcher -->
  <rect x="480" y="180" width="150" height="80" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="555" y="205" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">watcher</text>
  <rect x="490" y="215" width="130" height="35" rx="4" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="555" y="230" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Rebuilds apps when</text>
  <text x="555" y="243" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">./apps/* changes</text>
  
  <!-- vite (dev only) -->
  <rect x="80" y="280" width="180" height="80" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#64748b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="170" y="305" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">[vite] — Dev only</text>
  <rect x="90" y="315" width="160" height="35" rx="4" fill="rgba(30, 41, 59, 0.4)"/>
  <text x="170" y="330" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">HMR for React</text>
  <text x="170" y="343" fill="#475569" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Source bind mounted</text>
  
  <!-- Dev box -->
  <rect x="50" y="400" width="280" height="80" rx="6" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="190" y="425" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Dev</text>
  <text x="190" y="445" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Source code bind mounted</text>
  <text x="190" y="460" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">api runs from src/</text>
  <text x="190" y="473" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">vite serves with HMR</text>
  
  <!-- Prod box -->
  <rect x="370" y="400" width="280" height="80" rx="6" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="510" y="425" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Prod</text>
  <text x="510" y="445" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Bundled server (dist-server/)</text>
  <text x="510" y="460" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">static files in image</text>
  <text x="510" y="473" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">nginx serves pre-built</text>
</svg>