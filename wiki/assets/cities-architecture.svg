<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="400" y="30" fill="white" font-size="13" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Cities — Deck.gl + CitiesTheatre Architecture</text>

  <!-- CitiesApp -->
  <rect x="20" y="50" width="760" height="455" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="40" y="75" fill="#22d3ee" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">CitiesApp</text>

  <!-- View Mode Router -->
  <rect x="40" y="95" width="720" height="40" rx="5" fill="rgba(30, 41, 59, 0.6)" stroke="#475569" stroke-width="1"/>
  <text x="400" y="120" fill="white" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">viewMode: '2d' | 'debug' | '3d'</text>

  <!-- 2D View -->
  <rect x="40" y="155" width="230" height="80" rx="5" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="155" y="180" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">MapCanvas (2D)</text>
  <text x="155" y="200" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Canvas 2D rendering</text>
  <text x="155" y="218" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">viewMode='2d'</text>

  <!-- Debug View -->
  <rect x="285" y="155" width="230" height="80" rx="5" fill="rgba(251, 146, 60, 0.2)" stroke="#fb923c" stroke-width="1"/>
  <text x="400" y="180" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">DebugCanvas (2D)</text>
  <text x="400" y="200" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Canvas 2D + tensor viz</text>
  <text x="400" y="218" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">viewMode='debug'</text>

  <!-- 3D View -->
  <rect x="530" y="155" width="230" height="80" rx="5" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="645" y="180" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Deck3DWrapper</text>
  <text x="645" y="200" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Deck.gl + MapLibre GL</text>
  <text x="645" y="218" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">viewMode='3d'</text>

  <!-- Arrows from viewMode to views -->
  <line x1="155" y1="135" x2="155" y2="150" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="400" y1="135" x2="400" y2="150" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="645" y1="135" x2="645" y2="150" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>

  <!-- DeckGLScene3D -->
  <rect x="530" y="255" width="230" height="60" rx="5" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="645" y="280" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">DeckGLScene3D</text>
  <text x="645" y="298" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">generation + IndexedDB cache</text>

  <line x1="645" y1="235" x2="645" y2="250" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>

  <!-- DeckGLMap -->
  <rect x="40" y="260" width="470" height="230" rx="6" fill="rgba(22, 163, 74, 0.12)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="60" y="285" fill="#22c55e" font-size="10" font-weight="600" font-family="JetBrains Mono, monospace">DeckGLMap</text>

  <!-- DeckGL core -->
  <rect x="60" y="300" width="200" height="80" rx="4" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="160" y="325" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">DeckGL</text>
  <text x="160" y="345" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">viewport · layers · effects</text>
  <text x="160" y="362" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">GeoJsonLayers × 5</text>

  <!-- MapLibre -->
  <rect x="280" y="300" width="210" height="80" rx="4" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="385" y="325" fill="white" font-size="9" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">MapLibre GL</text>
  <text x="385" y="345" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">OpenFreeMap positron</text>
  <text x="385" y="362" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">base map tiles</text>

  <!-- LightingEffect -->
  <rect x="60" y="395" width="200" height="45" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="160" y="418" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">LightingEffect</text>
  <text x="160" y="432" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">SunLight + AmbientLight</text>

  <!-- GeoJsonLayers list -->
  <rect x="280" y="395" width="210" height="80" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="385" y="415" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Layers (render order)</text>
  <text x="385" y="432" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Buildings (extruded) 🞄 Parks</text>
  <text x="385" y="447" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Roads (3 types) 🞄 River 🞄 Sea</text>
  <text x="385" y="462" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">tolltip: buildingId + height</text>

  <!-- CitiesTheatre overlay -->
  <rect x="530" y="335" width="230" height="80" rx="5" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="645" y="360" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">CitiesTheatre</text>
  <text x="645" y="380" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">100% Mantine overlay</text>
  <text x="645" y="398" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Lighting · Sky · Fog · Camera</text>

  <line x1="645" y1="315" x2="645" y2="330" stroke="#64748b" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Store connection -->
  <rect x="530" y="430" width="230" height="45" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="645" y="453" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">citiesStore (Zustand)</text>
  <text x="645" y="467" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">persisted to localStorage</text>

  <!-- Store connections -->
  <line x1="530" y1="375" x2="515" y2="453" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <line x1="490" y1="418" x2="525" y2="453" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="40" y="475" width="470" height="25" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="60" y="492" fill="#64748b" font-size="8" font-family="JetBrains Mono, monospace">Source of truth: citiesStore (Zustand, persisted) · No Theatre.js runtime · 100% Mantine UI</text>
</svg>