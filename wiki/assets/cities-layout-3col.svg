<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="g3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#g3)"/>
  
  <!-- CitiesApp -->
  <rect x="30" y="20" width="840" height="60" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="450" y="55" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">CitiesApp (flex row)</text>
  
  <!-- MapCanvas3D -->
  <rect x="30" y="100" width="600" height="350" rx="8" fill="rgba(6, 78, 59, 0.2)" stroke="#34d399" stroke-width="1.5"/>
  <text x="50" y="125" fill="#34d399" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">MapCanvas3D</text>
  
  <!-- SceneInspectorLayout -->
  <rect x="50" y="145" width="560" height="290" rx="6" fill="rgba(76, 29, 149, 0.2)" stroke="#a78bfa" stroke-width="1"/>
  <text x="70" y="168" fill="#a78bfa" font-size="10" font-weight="500" font-family="JetBrains Mono, monospace">SceneInspectorLayout</text>
  
  <!-- LEFT Panel -->
  <rect x="70" y="185" width="150" height="230" rx="4" fill="rgba(251, 146, 60, 0.1)" stroke="#fb923c" stroke-width="1"/>
  <text x="145" y="205" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">LEFT 240px</text>
  <text x="145" y="220" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">scene-hierarchy-panel</text>
  <rect x="80" y="235" width="130" height="170" rx="3" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="145" y="255" fill="#fb923c" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">HierarchyPanel</text>
  <text x="145" y="275" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">· Search</text>
  <text x="145" y="290" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">· BBox / Wire btns</text>
  <text x="145" y="305" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">· Tree view</text>
  <text x="145" y="320" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">· StatsBar (fps)</text>
  
  <!-- CENTER Panel -->
  <rect x="240" y="185" width="180" height="230" rx="4" fill="rgba(22, 163, 74, 0.15)" stroke="#22c55e" stroke-width="1"/>
  <text x="330" y="205" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">CENTER flex:1</text>
  <text x="330" y="220" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">canvas wrapper</text>
  <rect x="250" y="235" width="160" height="170" rx="3" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="330" y="255" fill="#22d3ee" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">TheatreEditorSheetProvider</text>
  <text x="330" y="275" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">↓</text>
  <text x="330" y="295" fill="#64748b" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">Canvas (R3F)</text>
  <text x="330" y="315" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">SceneDebuggerScanner</text>
  <text x="330" y="330" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">BoundingBoxHelper</text>
  
  <!-- RIGHT Panel -->
  <rect x="440" y="185" width="150" height="230" rx="4" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1"/>
  <text x="515" y="205" fill="white" font-size="10" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">RIGHT 320px</text>
  <text x="515" y="220" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">scene-inspector-panel</text>
  <rect x="450" y="235" width="130" height="80" rx="3" fill="rgba(30, 41, 59, 0.6)"/>
  <text x="515" y="255" fill="#3b82f6" font-size="8" font-weight="500" text-anchor="middle" font-family="JetBrains Mono, monospace">Tabs</text>
  <text x="515" y="275" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Inspector | Scene</text>
  <text x="515" y="290" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">(Scene default)</text>
  
  <rect x="450" y="325" width="130" height="80" rx="3" fill="rgba(30, 41, 59, 0.5)"/>
  <text x="515" y="345" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Inspector tab →</text>
  <text x="515" y="360" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">PropertiesPanel</text>
  <text x="515" y="380" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">Scene tab →</text>
  <text x="515" y="395" fill="#64748b" font-size="7" text-anchor="middle" font-family="JetBrains Mono, monospace">9 Theatre groups</text>
  
  <!-- InfoSidebar (hidden) -->
  <rect x="660" y="100" width="200" height="80" rx="6" fill="rgba(30, 41, 59, 0.4)" stroke="#475569" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="760" y="125" fill="#64748b" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">InfoSidebar</text>
  <text x="760" y="145" fill="#475569" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">HIDDEN when</text>
  <text x="760" y="160" fill="#475569" font-size="8" text-anchor="middle" font-family="JetBrains Mono, monospace">showTheatreEditor=true</text>
  
  <!-- Legend -->
  <rect x="660" y="200" width="200" height="120" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#475569" stroke-width="1"/>
  <text x="760" y="225" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">3-Column Layout</text>
  <text x="680" y="250" fill="#fb923c" font-size="8" font-family="JetBrains Mono, monospace">LEFT: Hierarchy</text>
  <text x="680" y="270" fill="#22c55e" font-size="8" font-family="JetBrains Mono, monospace">CENTER: Canvas</text>
  <text x="680" y="290" fill="#3b82f6" font-size="8" font-family="JetBrains Mono, monospace">RIGHT: Inspector/Scene</text>
  <text x="680" y="310" fill="#64748b" font-size="7" font-family="JetBrains Mono, monospace">Blender-style UI</text>
</svg>