<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <pattern id="gr" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#gr)"/>
  
  <!-- Domain Layer -->
  <rect x="40" y="30" width="520" height="55" rx="8" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="300" y="50" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Domain Layer</text>
  <text x="300" y="70" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">(pure entities/factories)</text>
  
  <!-- Arrow -->
  <line x1="300" y1="85" x2="300" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- Infrastructure Layer -->
  <rect x="40" y="105" width="520" height="55" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="300" y="125" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Infrastructure Layer</text>
  <text x="300" y="145" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">(adapters: react-rnd, IndexedDB)</text>
  
  <!-- Arrow -->
  <line x1="300" y1="160" x2="300" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- Presentation Layer -->
  <rect x="40" y="180" width="520" height="55" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="300" y="200" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Presentation Layer</text>
  <text x="300" y="220" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">(React components + Zustand stores)</text>
</svg>